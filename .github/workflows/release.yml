name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Only install tools needed for packaging, not build dependencies
          sudo apt-get install -y tar gzip

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          vcpkg install sdl2 sdl2-mixer[mpg123] glew freeglut opengl --triplet x64-windows
          choco install nsis
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Configure CMake (Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build (Windows only)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release --verbose

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd build
          cpack -C Release

      - name: Create Source Package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Create source distribution with build instructions
          mkdir -p dist
          tar czf dist/HeavensFortress-${{ github.ref_name }}-source.tar.gz \
            --exclude='.git' \
            --exclude='build*' \
            --exclude='dist' \
            --exclude='.github' \
            --transform 's,^,HeavensFortress-source/,' \
            .
          
          # Create build instructions
          cat > dist/BUILD_INSTRUCTIONS.txt << 'EOF'
          Heaven's Fortress - Linux Build Instructions
          =============================================

          Prerequisites:
          --------------
          Install the following packages on Ubuntu/Debian:
            sudo apt-get install build-essential cmake libsdl2-dev libsdl2-mixer-dev \
                                 libglew-dev freeglut3-dev libomp-dev libgl1-mesa-dev \
                                 libglu1-mesa-dev mesa-common-dev pkg-config

          Build Steps:
          ------------
          1. Extract the source archive:
             tar xzf HeavensFortress-*-source.tar.gz
             cd HeavensFortress-source

          2. Create build directory:
             mkdir build && cd build

          3. Configure with CMake:
             cmake .. -DCMAKE_BUILD_TYPE=Release

          4. Build:
             make -j$(nproc)

          5. Install (optional):
             sudo make install

          Or create a DEB package:
             cpack -G DEB

          The executables will be in the build directory:
          - HeavensFortressClient (game client)
          - HeavensFortressServer (game server)
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HeavensFortress-${{ matrix.os }}
          path: |
            build/HeavensFortress*
            dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Prepare Release Files
        run: |
          mkdir release
          # Move files from subdirectories (created by download-artifact) to a single release folder
          find artifacts -type f \( -name "HeavensFortress*" -o -name "*.exe" -o -name "*.dmg" -o -name "*.tar.gz" -o -name "*.deb" \) -exec cp {} release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
